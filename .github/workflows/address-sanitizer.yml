---
name: Address sanitizer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Direct unit tests with Address Sanitizer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc meson ninja-build pkg-config libssl-dev
      - name: Build and test
        run: |
          meson setup builddir -Db_sanitize=address -Dbuildtype=debug
          meson compile -C builddir pkcs11
          meson test -C builddir --suite unittests --print-errorlogs
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: address-sanitizer-logs
          path: builddir/meson-logs/
